name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install mypy
        run: pip install mypy
      - name: Run mypy
        run: mypy --ignore-missing-imports .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v

  i18n-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check i18n key alignment between locales/zh and locales/en
        run: |
          python - <<'EOF'
          import json
          import os
          import sys
          from pathlib import Path

          zh_dir = Path("locales/zh")
          en_dir = Path("locales/en")

          if not zh_dir.is_dir() or not en_dir.is_dir():
              print("locales/zh 或 locales/en 目录不存在，跳过检查")
              sys.exit(0)

          zh_files = {p.name for p in zh_dir.glob("*.json")}
          en_files = {p.name for p in en_dir.glob("*.json")}

          missing_in_en = zh_files - en_files
          missing_in_zh = en_files - zh_files

          if missing_in_en:
              print(f"以下文件在 locales/en 中缺失: {sorted(missing_in_en)}")
              sys.exit(1)
          if missing_in_zh:
              print(f"以下文件在 locales/zh 中缺失: {sorted(missing_in_zh)}")
              sys.exit(1)

          def collect_keys(obj, prefix=""):
              keys = set()
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      full = f"{prefix}.{k}" if prefix else k
                      if isinstance(v, dict):
                          keys.update(collect_keys(v, full))
                      else:
                          keys.add(full)
              return keys

          has_error = False
          common_files = sorted(zh_files & en_files)
          for fname in common_files:
              zh_data = json.loads((zh_dir / fname).read_text(encoding="utf-8"))
              en_data = json.loads((en_dir / fname).read_text(encoding="utf-8"))
              zh_keys = collect_keys(zh_data)
              en_keys = collect_keys(en_data)
              only_zh = zh_keys - en_keys
              only_en = en_keys - zh_keys
              if only_zh:
                  print(f"[{fname}] 仅在 zh 中存在的 key: {sorted(only_zh)}")
                  has_error = True
              if only_en:
                  print(f"[{fname}] 仅在 en 中存在的 key: {sorted(only_en)}")
                  has_error = True

          if has_error:
              print("i18n key 对齐检查失败")
              sys.exit(1)
          print("i18n key 对齐检查通过")
          EOF
