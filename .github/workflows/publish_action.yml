name: Publish to Comfy registry
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # ============ 后端 gate：pytest 必须通过（与 release.yml 一致）============
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package and run tests
        run: |
          pip install -e ".[dev]"
          pytest tests/ -q

      # ============ 前端构建 ============
      # 发布前重新编译，保证 Registry 包内的 Vue 产物与 src/ 源码一致
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 不启用 cache: 'npm'：package-lock.json 被 .gitignore 排除，仓库内不存在锁文件，
          # setup-node 找不到锁文件会直接报错中断整个 job。

      - name: Install dependencies and build frontend
        run: |
          npm install
          npm run build

      - name: Verify build artifacts exist
        run: |
          test -f js/promptcraft-vue.js || { echo "ERROR: js/promptcraft-vue.js not built"; exit 1; }
          test -f js/promptcraft-vue.css || { echo "ERROR: js/promptcraft-vue.css not built"; exit 1; }

      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }} ## Add your own personal access token to your Github Repository secrets and reference it here.
