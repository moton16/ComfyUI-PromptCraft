[project]
name = "ComfyUI-PromptCraft"
description = "An all-in-one ComfyUI node for LoRA loading & prompt enhancement. Features a 15+ dimension bilingual tag library, LoRA group management with inline canvas stack and editable trigger words, LLM-powered smart prompt expansion with chain-of-thought control, and an AI Agent that drives LoRA stacking and base model switching via natural language — covering every core stage of your AI painting workflow from inspiration to model orchestration."
version = "1.2.4"
license = "MIT" 
