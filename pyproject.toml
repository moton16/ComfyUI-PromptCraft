[project]
name = "ComfyUI-PromptCraft"
description = "PromptCraft — ComfyUI Lora加载&提示词增强节点。PromptCraft — ComfyUI 全链路 AI 绘画增强插件。内置 15+ 维度中英对照标签库，告别提示词荒；LoRA 群组管理 + 画布内联栈，可编辑LoRA特殊提示词告别翻来覆去找提示词，从加载到权重调节一键搞定；LLM 大模型接入，智能扩写 + 思维链自动控制；AI Agent 自然语言驱动，用中文描述需求即可操控 LoRA 栈和底模切换。从灵感生成到模型编排，一个插件覆盖 AI 绘画工作流核心环节，持续迭代中。"
version = "1.2.1"
license = "MIT" 
